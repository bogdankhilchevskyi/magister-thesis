name: Render review edition
on:
  push:
    branches: [build/review-c70d9c3-1]
permissions:
  contents: write
jobs:
  render:
    if: github.event.head_commit.message == 'Render the review edition once'
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install python-docx pymupdf resvg-py Pillow
      - shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files\LibreOffice\program\soffice.com')) {
            choco install libreoffice-fresh -y --no-progress
          }
          if (!(Test-Path 'C:\Program Files\LibreOffice\program\soffice.com')) { throw "Writer unavailable" }
      - run: python scripts/build_thesis.py
      - run: python scripts/preview_once.py
      - uses: actions/upload-artifact@v4
        with:
          name: review-edition
          path: |
            final/
            build-proof/
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f final/*.docx final/*.pdf build-proof/
          git commit -m "Store rendered review proofs"
          git push origin HEAD:refs/heads/build/review-c70d9c3-1
